name: Jekyll build check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: build-check-1
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Research Intern, MINIMAX" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/publications/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html
          grep -q "Vicent0205" _site/index.html
          for path in cv talks teaching portfolio year-archive markdown talkmap sitemap about; do
            if [ -e "_site/$path" ]; then
              echo "Unexpected generated path: $path"
              exit 1
            fi
          done
          if grep -R -l "Paper Title Number\|GitHub University\|Skill 1\|Your Name" _site --include='*.html'; then
            echo "Template placeholder content found in generated HTML"
            exit 1
          fi
          echo "Generated site files:"
          find _site -type f | sed 's#^_site/##' | sort
